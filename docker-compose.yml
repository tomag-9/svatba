services:
  db:
    image: postgres:16-alpine
    container_name: svatba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-2026}
      POSTGRES_DB: ${POSTGRES_DB:-svatba}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-svatba}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svatba-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      WEDDING_APP_PASSWORD: ${WEDDING_APP_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:hello@example.com}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      INTERNAL_PUSH_SECRET: ${INTERNAL_PUSH_SECRET:-}
      TZ: Europe/Bratislava
    networks:
      - app_network
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

volumes:
  postgres_data:

networks:
  app_network:
    name: ${DOCKER_NETWORK_NAME:-svatba-app_default}
    external: ${DOCKER_NETWORK_EXTERNAL:-false}
